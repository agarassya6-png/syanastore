name: Build HYper key-enabled IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          cd "Tele @khatri_ashok04"

          ROOT="$(pwd)"
          BUILD_DIR="${ROOT}/build"
          ARCHIVE="${BUILD_DIR}/OGIOS.xcarchive"
          IPA="${BUILD_DIR}/HYper-Regedit-Key-Enabled-unsigned.ipa"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"

          xcodebuild \
            -project "${ROOT}/ThreeOneOSFive.xcodeproj" \
            -scheme OGIOS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${ARCHIVE}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            archive

          APP=$(find "${ARCHIVE}/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          mkdir -p "${BUILD_DIR}/Payload"
          cp -R "${APP}" "${BUILD_DIR}/Payload/"
          cd "${BUILD_DIR}"
          /usr/bin/zip -qry "${IPA}" Payload
          rm -rf Payload
          echo "✅ IPA ready:"
          ls -lh "${IPA}"

      - uses: actions/upload-artifact@v4
        with:
          name: HYper-Regedit-Key-Enabled-unsigned-ipa
          path: "Tele @khatri_ashok04/build/HYper-Regedit-Key-Enabled-unsigned.ipa"
          retention-days: 7
