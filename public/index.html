<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyanaStore.id — Digital Gaming Marketplace</title>
<meta name="description" content="Digital Gaming Marketplace. Lightning Fast • Trusted Service. Mobile Legends, Free Fire, Roblox, dan lainnya. Proses instan 24/7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
<style>
/* ============================
   DESIGN TOKENS
============================= */
:root {
  --bg: #060812;
  --bg2: #0C1024;
  --surface: #0F1530;
  --surface2: #161D3E;
  --surface3: #1D2550;
  --glass: rgba(15, 21, 48, 0.7);
  --glass2: rgba(22, 29, 62, 0.5);
  --line: rgba(108, 124, 209, 0.2);
  --line2: rgba(108, 124, 209, 0.1);
  --text: #EDF0FF;
  --text2: #C5CAE9;
  --muted: #6E7AB0;
  --muted2: #4A5480;

  /* Brand Colors */
  --violet: #7B5CF0;
  --violet-light: #9B7CF8;
  --violet-dark: #5B3FD0;
  --teal: #00E5CC;
  --teal-dark: #00B8A0;
  --gold: #FFB800;
  --pink: #FF4D8D;
  --pink-dark: #D63571;
  --blue: #4DA6FF;

  /* Gradients */
  --grad-primary: linear-gradient(135deg, #7B5CF0 0%, #00E5CC 100%);
  --grad-violet: linear-gradient(135deg, #7B5CF0, #5B3FD0);
  --grad-teal: linear-gradient(135deg, #00E5CC, #00B8A0);
  --grad-pink: linear-gradient(135deg, #FF4D8D, #D63571);
  --grad-gold: linear-gradient(135deg, #FFB800, #FF8C00);
  --grad-card: linear-gradient(160deg, rgba(123,92,240,0.08) 0%, rgba(0,229,204,0.04) 100%);

  /* Effects */
  --glow-violet: 0 0 40px rgba(123, 92, 240, 0.3);
  --glow-teal: 0 0 40px rgba(0, 229, 204, 0.3);
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4), 0 1px 0 rgba(255,255,255,0.03) inset;
  --shadow-btn: 0 8px 24px rgba(123, 92, 240, 0.4);
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}

/* ============================
   RESET & BASE
============================= */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
h1, h2, h3, h4, h5 { font-family: 'Space Grotesk', sans-serif; line-height: 1.2; }
.mono { font-family: 'JetBrains Mono', monospace; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
img { max-width: 100%; display: block; }
::selection { background: var(--violet); color: #fff; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--violet-dark); }

/* ============================
   LAYOUT
============================= */
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }

/* ============================
   NOISE TEXTURE OVERLAY
============================= */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.5;
}

/* ============================
   BACKGROUND ORBS
============================= */
.bg-orbs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
  animation: orbFloat 12s ease-in-out infinite;
}
.bg-orb-1 {
  width: 500px; height: 500px;
  background: var(--violet);
  top: -150px; right: -100px;
  animation-delay: 0s;
}
.bg-orb-2 {
  width: 400px; height: 400px;
  background: var(--teal);
  bottom: 10%; left: -150px;
  animation-delay: -4s;
}
.bg-orb-3 {
  width: 350px; height: 350px;
  background: var(--pink);
  top: 50%; right: 20%;
  animation-delay: -8s;
}
@keyframes orbFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.05); }
}

/* ============================
   HEADER
============================= */
header.site {
  position: sticky; top: 0; z-index: 100;
  padding: 0 28px;
  background: rgba(6, 8, 18, 0.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
  transition: all 0.3s ease;
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1200px; margin: 0 auto; padding: 16px 0;
}
.logo {
  display: flex; align-items: center; gap: 12px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 19px; letter-spacing: -0.3px;
  color: var(--text);
}
.logo-icon {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(0, 200, 255, 0.06);
  border: 1px solid rgba(0, 200, 255, 0.18);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px rgba(0, 180, 255, 0.25), inset 0 1px 0 rgba(255,255,255,0.08);
  flex-shrink: 0;
  position: relative;
  overflow: visible;
}
.logo-text span { color: var(--teal); }

nav.main-nav {
  display: flex; gap: 32px;
  font-size: 14px; font-weight: 500; color: var(--muted);
}
nav.main-nav a {
  transition: color 0.2s ease;
  position: relative;
  padding-bottom: 2px;
}
nav.main-nav a::after {
  content: '';
  position: absolute; bottom: -2px; left: 0;
  width: 0; height: 1.5px;
  background: var(--grad-primary);
  transition: width 0.3s ease;
  border-radius: 99px;
}
nav.main-nav a:hover { color: var(--text); }
nav.main-nav a:hover::after { width: 100%; }

.header-actions { display: flex; align-items: center; gap: 10px; }

/* ============================
   BUTTONS
============================= */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative; overflow: hidden;
  white-space: nowrap;
}
.btn::before {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.08);
  opacity: 0;
  transition: opacity 0.2s;
}
.btn:hover::before { opacity: 1; }
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--grad-violet);
  color: #fff;
  box-shadow: 0 4px 16px rgba(123, 92, 240, 0.35);
}
.btn-primary:hover { box-shadow: 0 8px 28px rgba(123, 92, 240, 0.5); transform: translateY(-1px); }

.btn-ghost {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  color: var(--text2);
}
.btn-ghost:hover { border-color: rgba(123,92,240,0.4); color: var(--text); background: rgba(123,92,240,0.06); }

.btn-teal {
  background: var(--grad-teal);
  color: #021F1B;
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(0, 229, 204, 0.3);
}
.btn-teal:hover { box-shadow: 0 8px 28px rgba(0, 229, 204, 0.45); transform: translateY(-1px); }

.btn-danger { background: rgba(255,77,141,0.1); border: 1px solid rgba(255,77,141,0.3); color: var(--pink); }
.btn-danger:hover { background: rgba(255,77,141,0.15); border-color: var(--pink); }

.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-block { width: 100%; justify-content: center; }
.btn-lg { padding: 14px 28px; font-size: 15px; border-radius: var(--radius); }

/* ============================
   TICKER
============================= */
.ticker-wrap {
  background: rgba(123, 92, 240, 0.06);
  border-bottom: 1px solid var(--line);
  overflow: hidden; padding: 10px 0;
  position: relative;
}
.ticker-wrap::before, .ticker-wrap::after {
  content: '';
  position: absolute; top: 0; width: 80px; height: 100%; z-index: 1;
}
.ticker-wrap::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
.ticker-wrap::after { right: 0; background: linear-gradient(to left, var(--bg), transparent); }

.ticker-track {
  display: flex; gap: 48px;
  white-space: nowrap;
  animation: scroll-left 35s linear infinite;
  width: max-content;
}
.ticker-track:hover { animation-play-state: paused; }
@keyframes scroll-left {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.ticker-item {
  font-size: 12.5px; color: var(--muted2);
  display: flex; align-items: center; gap: 10px;
  font-weight: 500;
}
.ticker-item strong { color: var(--text2); font-weight: 600; }
.dot-live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 3px rgba(0,229,204,0.2);
  animation: pulse 2s ease infinite;
  flex-shrink: 0;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(0,229,204,0.2); }
  50% { box-shadow: 0 0 0 6px rgba(0,229,204,0.1); }
}

/* ============================
   HERO
============================= */
.hero {
  padding: 80px 28px 56px;
  position: relative; overflow: hidden;
}
.hero-inner {
  max-width: 1200px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 64px; align-items: center; position: relative; z-index: 1;
}

/* Left side */
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--teal);
  background: rgba(0,229,204,0.08); border: 1px solid rgba(0,229,204,0.2);
  padding: 6px 14px; border-radius: 99px; margin-bottom: 24px;
}
.hero-eyebrow span { animation: blink 2s step-end infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

.hero h1 {
  font-size: 48px; font-weight: 800;
  line-height: 1.1; margin-bottom: 20px;
  letter-spacing: -1.5px;
}
.hero h1 .grad {
  background: var(--grad-primary);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.hero-desc {
  color: var(--muted); font-size: 16px; line-height: 1.7;
  max-width: 450px; margin-bottom: 36px;
}

.search-hero {
  display: flex; gap: 0;
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  max-width: 480px;
  margin-bottom: 44px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-hero:focus-within {
  border-color: rgba(123,92,240,0.4);
  box-shadow: 0 0 0 3px rgba(123,92,240,0.08);
}
.search-hero input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); padding: 14px 18px; font-size: 14px;
  font-family: inherit;
}
.search-hero input::placeholder { color: var(--muted2); }
.search-hero button {
  background: var(--grad-violet); color: #fff;
  font-family: inherit; font-size: 13px; font-weight: 700;
  padding: 12px 20px; border: none; cursor: pointer;
  transition: opacity 0.2s;
  letter-spacing: 0.3px;
}
.search-hero button:hover { opacity: 0.9; }

.hero-stats {
  display: flex; gap: 40px;
}
.hero-stat {}
.hero-stat-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px; font-weight: 700; line-height: 1;
  margin-bottom: 4px;
}
.hero-stat-value.violet { color: var(--violet-light); }
.hero-stat-value.teal { color: var(--teal); }
.hero-stat-value.gold { color: var(--gold); }
.hero-stat-label { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Right side — Visual card */
.hero-visual {
  position: relative;
}
.hero-card {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 28px;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.hero-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(123,92,240,0.5), var(--teal), transparent);
}
.hero-card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.hero-card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
.status-live {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; color: var(--teal);
  background: rgba(0,229,204,0.08); border: 1px solid rgba(0,229,204,0.2);
  padding: 4px 10px; border-radius: 99px;
}

.mini-game-row {
  display: flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--line2);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
  transition: all 0.25s ease; cursor: default;
}
.mini-game-row:last-child { margin-bottom: 0; }
.mini-game-row:hover { background: rgba(123,92,240,0.05); border-color: rgba(123,92,240,0.2); }
.mini-game-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--grad-card);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.mini-game-info { flex: 1; }
.mini-game-name { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
.mini-game-sub { font-size: 11px; color: var(--muted); }
.mini-game-price { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--teal); }

.hero-floating-badge {
  position: absolute;
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  font-size: 12.5px; font-weight: 600;
  box-shadow: var(--shadow-card);
  animation: floatBadge 4s ease-in-out infinite;
  white-space: nowrap;
}
.hero-floating-badge.badge-left {
  bottom: -20px; left: -30px;
  animation-delay: 0s;
}
.hero-floating-badge.badge-right {
  top: -20px; right: -20px;
  animation-delay: -2s;
}
@keyframes floatBadge {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.badge-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

/* ============================
   SECTIONS
============================= */
.section { padding: 64px 28px; position: relative; z-index: 1; }
.section-inner { max-width: 1200px; margin: 0 auto; }

.section-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--violet-light);
  margin-bottom: 10px;
}
.section-label::before {
  content: '';
  width: 20px; height: 2px;
  background: var(--grad-primary); border-radius: 99px;
}

.section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
}
.section-head-left h2 {
  font-size: 28px; font-weight: 800;
  letter-spacing: -0.5px; margin-bottom: 6px;
}
.section-head-left p { color: var(--muted); font-size: 14px; }

/* ============================
   CATEGORY PILLS
============================= */
.cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  padding: 8px 18px; border-radius: 99px;
  border: 1px solid var(--line); font-size: 13px; font-weight: 600;
  color: var(--muted); background: rgba(255,255,255,0.02);
  cursor: pointer; transition: all 0.2s ease;
}
.pill:hover { color: var(--text); border-color: rgba(123,92,240,0.35); background: rgba(123,92,240,0.05); }
.pill.active {
  background: rgba(123,92,240,0.15);
  color: var(--violet-light);
  border-color: rgba(123,92,240,0.4);
}

/* ============================
   GAME GRID
============================= */
.game-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
.game-card {
  background: var(--glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-card);
  transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
              border-color 0.3s ease,
              box-shadow 0.35s ease;
  position: relative;
}
.game-card::before {
  content: '';
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, transparent 40%, rgba(6,8,18,0.85) 100%);
  pointer-events: none;
  opacity: 0; transition: opacity 0.3s ease;
}
.game-card:hover {
  transform: translateY(-8px) scale(1.01);
  border-color: rgba(var(--accent-rgb, 123, 92, 240), 0.45);
  box-shadow: 0 20px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(var(--accent-rgb, 123, 92, 240), 0.15);
}
.game-card:hover::before { opacity: 1; }

.game-card-img-wrapper {
  width: 100%; aspect-ratio: 3/4;
  overflow: hidden; background: var(--surface2);
}
.game-card-img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.game-card:hover .game-card-img { transform: scale(1.1); }

.game-card-body {
  padding: 18px;
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface2) 100%);
  border-top: 1px solid var(--line2);
  flex-grow: 1;
  display: flex; flex-direction: column; gap: 4px;
}
.game-card h4 { font-size: 14.5px; font-weight: 700; color: var(--text); }
.game-card p { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.game-card .btn {
  margin-top: auto; width: 100%; justify-content: center;
  font-size: 13px; font-weight: 700; padding: 10px;
  border-radius: var(--radius-sm);
  background: var(--grad-violet); color: #fff;
  box-shadow: 0 4px 14px rgba(123,92,240,0.3);
}
.game-card .btn:hover { box-shadow: 0 8px 24px rgba(123,92,240,0.45); }

/* ============================
   FEATURES STRIP
============================= */
.features-strip {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 32px 28px;
  margin: 0;
}
.features-inner {
  max-width: 1200px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
.feature-item {
  display: flex; align-items: flex-start; gap: 16px;
}
.feature-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.feature-icon.violet { background: rgba(123,92,240,0.1); border: 1px solid rgba(123,92,240,0.2); }
.feature-icon.teal { background: rgba(0,229,204,0.08); border: 1px solid rgba(0,229,204,0.2); }
.feature-icon.gold { background: rgba(255,184,0,0.08); border: 1px solid rgba(255,184,0,0.2); }
.feature-icon.pink { background: rgba(255,77,141,0.08); border: 1px solid rgba(255,77,141,0.2); }
.feature-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.feature-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* ============================
   TESTIMONIALS
============================= */
.testi-carousel-wrap {
  overflow: hidden;
  position: relative;
  padding: 16px 0;
  mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
}
.testi-track {
  display: flex; gap: 16px;
  width: max-content;
  animation: scroll-left 40s linear infinite;
}
.testi-track.reverse { animation: scroll-right 40s linear infinite; margin-top: 16px; }
.testi-track:hover { animation-play-state: paused; }
@keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes scroll-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
.testi-card {
  background: var(--glass);

async function loadAll(){
  try{
    const r = await fetch('/api/config');
    const d = await r.json();
    state.config = d.success ? d.config : DEFAULT_CONFIG;
  } catch(e){ state.config = DEFAULT_CONFIG; }

  try{
    const r = await fetch('/api/catalog');
    const d = await r.json();
    state.catalog = d.success ? d.catalog : DEFAULT_CATALOG;
  } catch(e){ state.catalog = DEFAULT_CATALOG; }

  try{
    const r = await fetch('/api/testimonials');
    const d = await r.json();
    state.testimonials = d.success ? d.testimonials : DEFAULT_TESTIMONIALS;
  } catch(e){ state.testimonials = DEFAULT_TESTIMONIALS; }

  await loadRecentSales();

  const storedPass = sessionStorage.getItem("syanastore_admin_pw");
  if(storedPass){
    try{
      const res = await fetch("/api/admin/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: storedPass })
      });
      const d = await res.json();
      if(d.success){
        state.adminPass = storedPass;
        state.isAdmin = true;
        await loadTransactions();
      } else {
        sessionStorage.removeItem("syanastore_admin_pw");
      }
    } catch(e){}
  }

  render();
}

async function loadRecentSales(){
  try{
    const r = await fetch('/api/sales/recent');
    const d = await r.json();
    state.recentSales = d.success ? d.recent : [];
  } catch(e){}
}

async function loadTransactions(){
  if(!state.isAdmin) return;
  try{
    const r = await fetch('/api/sales', { headers: { 'X-Admin-Password': state.adminPass } });
    const d = await r.json();
    if(d.success) state.transactions = d.sales;
  } catch(e){}
}

function fmtTime(ts){ const d = new Date(ts); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'2-digit'}) + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

  state.route = location.hash || '#/';
  state.checkoutStep=null;
  clearInterval(qrTimerInterval);
  clearInterval(statusPollInterval);
  render();
  window.scrollTo({top:0, behavior:'smooth'});

/* ===================== RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  if(!state.config){ app.innerHTML = '<div style="padding:80px;text-align:center;color:#6E7AB0;font-size:15px">Memuat SyanaStore.id...</div>'; return; }

  let html = '';
  if(state.route.startsWith('#/admin')){
    html = state.isAdmin ? renderAdmin() : renderAdminLogin();
  } else if(state.route.startsWith('#/game/')){
    html = renderHeader() + renderTicker() + renderGameDetail(state.route.replace('#/game/','')) + renderFooter();
  } else if(state.route === '#/track'){
    html = renderHeader() + renderTrackOrder() + renderFooter();
  } else {
    html = renderHeader() + renderTicker() + renderHero() + renderFeaturesStrip() + renderCatalogSection() + renderTestimonials() + renderFooter();
  }

  if(state.checkoutStep) html += renderCheckoutModal();
  if(state.toast) html += renderToast();

  app.innerHTML = html;
  attachEvents();

  // Selalu gambar ulang QR Code setelah DOM direset (mencegah hilang saat polling/timer update)
  if(state.checkoutStep === 'qr' && state.checkoutData){
    const el = document.getElementById('qrcodeCanvas');
    if(el){
      if(state.checkoutData.isMock){
        el.innerHTML = '<canvas id="qrisCanvasElement" style="width:180px;height:180px;display:block;margin:0 auto;"></canvas>';
        const canvas = document.getElementById('qrisCanvasElement');
        if(canvas && window.QRCode){
          window.QRCode.toCanvas(canvas, state.checkoutData.qrText, {
            width: 180,
            margin: 1,
            color: {
              dark: '#060812',
              light: '#ffffff'
            }
          }, function(err) {
            if(err) console.error('QR generation error:', err);
          });
        }
      } else {
        el.innerHTML = `<img src="${state.checkoutData.qrUrl}" alt="QRIS" style="width:180px;height:180px;display:block;margin:0 auto;" />`;
      }
    }
  }
}

    const count={};
    paidSales.forEach(t=>count[t.item]=(count[t.item]||0)+1);
    const arr = Object.entries(count).sort((a,b)=>b[1]-a[1]);

function renderTxTable(list){
  if(!list.length) return '<div class="empty"><div class="empty-icon">📭</div>Belum ada transaksi.</div>';
  return `<div style="overflow-x:auto"><table>
    <tr><th>Order ID</th><th>User ID / Username</th><th>Server / Password</th><th>No. WA</th><th>Game</th><th>Produk</th><th>Total</th><th>Waktu</th><th>Status</th><th>Aksi</th></tr>
    ${list.map(t=>{
      const isPending = t.status === 'Menunggu Pembayaran';
      const statusClass = t.status === 'Lunas' ? 'success' : (t.status === 'Batal' || t.status === 'Kadaluarsa' || t.status === 'Gagal' ? 'failed' : 'pending');
      const isRoblox = (t.game || '').toLowerCase().includes('roblox');
      return `
      <tr>
        <td class="mono" style="font-size:12px">${t.reference || t.orderId || '-'}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:28px;height:28px;border-radius:8px;background:rgba(123,92,240,0.12);border:1px solid rgba(123,92,240,0.2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">👤</span>
            <span class="mono" style="font-size:13px;font-weight:600;color:var(--text)" title="${isRoblox ? 'Roblox Username' : 'User ID'}">${t.buyerId || t.buyer || '-'}</span>
          </div>
        </td>
        <td>
          <span class="mono" style="font-size:12.5px;color:${(t.server && t.server !== '-') ? 'var(--teal)' : 'var(--muted2)'}">
            ${isRoblox ? `<span style="background:rgba(0,229,204,0.1);padding:2px 6px;border-radius:4px;font-size:11.5px">${t.server || '—'}</span>` : (t.server || '—')}
          </span>
        </td>
        <td>
          ${t.whatsapp ? `<a href="https://wa.me/${t.whatsapp}" target="_blank" rel="noopener" class="mono" style="color:var(--teal);text-decoration:underline">0${t.whatsapp.replace(/^0|^62/, '')}</a>` : '—'}
        </td>
        <td>${t.game || '-'}</td>
        <td>${t.item || t.productName || '-'}</td>
        <td class="mono">${fmtRupiah(t.price)}</td>
        <td style="white-space:nowrap">${fmtTime(t.createdAt || t.time)}</td>
        <td><span class="status-pill status-${statusClass}">${t.status}</span></td>
        <td>
          ${isPending ? `
          <div style="display:flex;gap:6px;flex-wrap:nowrap">
            <button class="btn btn-teal btn-sm" style="font-size:11px;padding:6px 10px;white-space:nowrap" data-confirm-tx="${t.merchantRef}">✅ Lunas</button>
            <button class="btn btn-danger btn-sm" style="font-size:11px;padding:6px 10px;white-space:nowrap" data-cancel-tx="${t.merchantRef}">❌ Batal</button>
          </div>` : `<span style="font-size:12px;color:var(--muted2)">—</span>`}
        </td>
      </tr>`;
    }).join('')}
  </table></div>`;
}

/* ===================== EVENTS ===================== */
function attachEvents(){
  // Category filter
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.onclick = ()=>{
      state.activeCategory = el.dataset.cat;
      render();
      document.getElementById('produk-section')?.scrollIntoView({behavior:'smooth'});
    };
  });

  // Game card navigation
  document.querySelectorAll('[data-game]').forEach(el=>{
    el.onclick = ()=>{ location.hash = '#/game/'+el.dataset.game; };
    el.onkeydown = (e)=>{ if(e.key === 'Enter') location.hash = '#/game/'+el.dataset.game; };
  });

  // Search
  const heroSearch = document.getElementById('heroSearch');
  if(heroSearch){
    heroSearch.oninput = (e)=>{
      state.searchQuery = e.target.value.trim().toLowerCase();
      refreshGamesGrid();
    };
    heroSearch.onkeydown = (e)=>{
      if(e.key === 'Enter') document.getElementById('produk-section')?.scrollIntoView({behavior:'smooth'});
    };
  }

  // Product select
  let selectedProduct = null;
  document.querySelectorAll('.product-card').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('.product-card').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
      const gameId = location.hash.replace('#/game/','');
      const game = state.catalog.find(g=>g.id===gameId);
      if(!game) return;
      const prod = game.products.find(p=>p.id===el.dataset.pid);
      if(!prod) return;
      selectedProduct = {game, prod};
      document.getElementById('totalDisplay').textContent = fmtRupiah(prod.price);
    };
  });

  // Buy button
  const buyBtn = document.getElementById('buyBtn');
  if(buyBtn) buyBtn.onclick = ()=>{
    if(!selectedProduct){ showToast('Pilih produk terlebih dahulu', true); return; }
    
    const userId = document.getElementById('userIdInput').value.trim();
    const serverVal = document.getElementById('serverIdInput').value.trim();
    const whatsapp = document.getElementById('whatsappInput').value.trim();
    
    const isRoblox = selectedProduct.game.id === 'roblox';
    
    if(!userId){ 
      document.getElementById('userIdInput').focus(); 
      showToast(isRoblox ? 'Masukkan Username Roblox dulu' : 'Masukkan User ID dulu', true); 
      return; 
    }
    
    if(isRoblox && !serverVal){
      document.getElementById('serverIdInput').focus();
      showToast('Masukkan Password Roblox dulu (Via Login)', true);
      return;
    }
    
    if(!whatsapp){
      document.getElementById('whatsappInput').focus();
      showToast('Masukkan Nomor WhatsApp kamu', true);
      return;
    }

    state.checkoutData = {
      gameId: selectedProduct.game.id,
      gameName: selectedProduct.game.name,
      productName: selectedProduct.prod.name,
      price: selectedProduct.prod.price,
      productId: selectedProduct.prod.id,
      userId,
      server: serverVal,
      whatsapp,
      orderId: '',
    };
    state.checkoutStep = 'form';
    render();
  };

  // Overlay close
  document.querySelectorAll('#checkoutOverlay').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target === el){
        state.checkoutStep=null;
        clearInterval(qrTimerInterval);
        clearInterval(statusPollInterval);
        render();
      }
    };
  });

  // Cancel checkout button
  const cancelBtn = document.getElementById('cancelCheckoutBtn');
  if(cancelBtn) cancelBtn.onclick = ()=>{
    state.checkoutStep=null; render();
  };

  // Success close
  const successCloseBtn = document.getElementById('successCloseBtn');
  if(successCloseBtn) successCloseBtn.onclick = ()=>{
    state.checkoutStep=null; render();
  };

  // Generate QR
  const genQrBtn = document.getElementById('genQrBtn');
  if(genQrBtn) genQrBtn.onclick = async ()=>{
    genQrBtn.textContent = '⏳ Membuat QRIS…';
    genQrBtn.disabled = true;
    try {
      const res = await fetch("/api/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          productId: state.checkoutData.productId, 
          buyerId: state.checkoutData.userId, 
          server: state.checkoutData.server, 
          whatsapp: state.checkoutData.whatsapp 
        })
      });
      const data = await res.json();
      if(data.success){
        state.checkoutData.orderId = data.reference;
        state.checkoutData.merchantRef = data.merchantRef;
        state.checkoutData.isMock = data.isMock;
        state.checkoutData.qrText = data.qrText;
        state.checkoutData.qrUrl = data.qrUrl;
        state.checkoutData.expiredTime = data.expiredTime;
        state.checkoutStep = 'qr';
        render();

        startCountdown(data.expiredTime);
        startStatusPolling();
      } else {
        showToast(data.message || 'Gagal membuat QRIS', true);
        genQrBtn.textContent = '⚡ Buat QRIS Sekarang';
        genQrBtn.disabled = false;
      }
    } catch(e) {
      showToast('Gagal menghubungi server', true);
      genQrBtn.textContent = '⚡ Buat QRIS Sekarang';
      genQrBtn.disabled = false;
    }
  };

  // Confirm payment
  const confirmPayBtn = document.getElementById('confirmPayBtn');
  if(confirmPayBtn) confirmPayBtn.onclick = async ()=>{
    if(state.checkoutData.isMock){
      confirmPayBtn.textContent = '⏳ Memproses…';
      confirmPayBtn.disabled = true;
      try {
        await fetch(`/api/sales/confirm-mock/${state.checkoutData.merchantRef}`, { method: "POST" });
        setTimeout(()=>{
          clearInterval(statusPollInterval);
          clearInterval(qrTimerInterval);
          state.checkoutStep = 'success'; render();
          loadRecentSales();
          if(state.isAdmin) loadTransactions();
        }, 1000);
      } catch(e) {
        showToast('Gagal memproses pembayaran', true);
        confirmPayBtn.disabled = false;
        confirmPayBtn.textContent = '✅ Saya Sudah Bayar';
      }
    } else {
      confirmPayBtn.textContent = '🔄 Mengecek…';
      confirmPayBtn.disabled = true;
      try {
        const res = await fetch(`/api/sales/status/${state.checkoutData.merchantRef}`);
        const data = await res.json();
        if(data.success && data.status === "Lunas"){
          clearInterval(statusPollInterval); clearInterval(qrTimerInterval);
          state.checkoutStep = 'success'; render();
          loadRecentSales();
          if(state.isAdmin) loadTransactions();
        } else {
          showToast('Pembayaran belum diterima, coba lagi', true);
          confirmPayBtn.disabled = false;
          confirmPayBtn.textContent = '🔄 Cek Status Pembayaran';
        }
      } catch(e) {
        confirmPayBtn.disabled = false;
        confirmPayBtn.textContent = '🔄 Cek Status Pembayaran';
      }
    }
  };

  // Admin login
  const loginBtn = document.getElementById('adminLoginBtn');
  if(loginBtn) loginBtn.onclick = async ()=>{
    const val = document.getElementById('adminPassInput').value;
    loginBtn.textContent = 'Memeriksa…'; loginBtn.disabled = true;
    try {
      const res = await fetch("/api/admin/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: val }) });
      const data = await res.json();
      if(data.success){
        sessionStorage.setItem("syanastore_admin_pw", val);
        state.adminPass = val; state.isAdmin = true; state.adminTab = 'overview';
        await loadTransactions(); render();
      } else {
        showToast('Password salah, coba lagi.', true);
        loginBtn.textContent = 'Masuk →'; loginBtn.disabled = false;
      }
    } catch(e) {
      showToast('Gagal menghubungi server', true);
      loginBtn.textContent = 'Masuk →'; loginBtn.disabled = false;
    }
  };

  const adminPassInput = document.getElementById('adminPassInput');
  if(adminPassInput) adminPassInput.onkeydown = (e)=>{ if(e.key === 'Enter') document.getElementById('adminLoginBtn')?.click(); };

  // Admin nav tabs
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ state.adminTab = el.dataset.tab; render(); };
  });

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{
    if(confirm('Yakin mau keluar dari dashboard?')){
      sessionStorage.removeItem("syanastore_admin_pw");
      state.isAdmin=false; render();
    }
  };

  const viewStoreBtn = document.getElementById('viewStoreBtn');
  if(viewStoreBtn) viewStoreBtn.onclick = ()=>{ location.hash = '#/'; };

  // Price save and instant state binding
  document.querySelectorAll('.price-input').forEach(input => {
    input.oninput = () => {
      const gameId = input.dataset.game, pid = input.dataset.pid;
      const val = parseInt(input.value, 10);
      if(!isNaN(val) && val >= 0){
        const game = state.catalog.find(g=>g.id===gameId);
        if(game){
          const prod = game.products.find(p=>p.id===pid);
          if(prod) prod.price = val;
        }
      }
    };
  });

  document.querySelectorAll('[data-save-price]').forEach(btn=>{
    btn.onclick = async ()=>{
      const gameId = btn.dataset.game, pid = btn.dataset.pid;
      const input = document.querySelector(`.price-input[data-game="${gameId}"][data-pid="${pid}"]`);
      const newPrice = parseInt(input.value, 10);
      if(isNaN(newPrice) || newPrice < 0){ showToast('Harga tidak valid', true); return; }
      const game = state.catalog.find(g=>g.id===gameId);
      const prod = game.products.find(p=>p.id===pid);
      const oldPrice = prod.price; prod.price = newPrice;
      try {
        const res = await fetch("/api/admin/catalog", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Password": state.adminPass },
          body: JSON.stringify({ catalog: state.catalog })
        });
        const data = await res.json();
        if(data.success){ showToast(`Harga ${prod.name} diperbarui ✓`); }
        else { prod.price = oldPrice; showToast(data.message || 'Gagal menyimpan', true); }
      } catch(e) { prod.price = oldPrice; showToast('Gagal menghubungi server', true); }
    };
  });

  // Delete product
  document.querySelectorAll('[data-delete-product]').forEach(btn=>{
    btn.onclick = async ()=>{
      const gameId = btn.dataset.game, pid = btn.dataset.pid;
      const game = state.catalog.find(g=>g.id===gameId);
      if(!game) return;
      const prod = game.products.find(p=>p.id===pid);
      if(!prod) return;
      if(!confirm(`Yakin ingin menghapus produk "${prod.name}" dari game ${game.name}?`)) return;
      
      const originalProducts = [...game.products];
      game.products = game.products.filter(p=>p.id!==pid);
      
      try {
        const res = await fetch("/api/admin/catalog", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Password": state.adminPass },
          body: JSON.stringify({ catalog: state.catalog })
        });
        const data = await res.json();
        if(data.success){
          showToast(`Produk "${prod.name}" berhasil dihapus ✓`);
          render();
        } else {
          game.products = originalProducts;
          showToast(data.message || 'Gagal menghapus produk', true);
        }
      } catch(e) {
        game.products = originalProducts;
        showToast('Gagal menghubungi server', true);
      }
    };
  });

  // Add product
  document.querySelectorAll('[data-add-product]').forEach(btn=>{
    btn.onclick = async ()=>{
      const gameId = btn.dataset.game;
      const nameInput = document.querySelector(`.add-name-input[data-game="${gameId}"]`);
      const priceInput = document.querySelector(`.add-price-input[data-game="${gameId}"]`);
      if(!nameInput || !priceInput) return;
      
      const newName = nameInput.value.trim();
      const newPrice = parseInt(priceInput.value, 10);
      
      if(!newName){ showToast('Masukkan nama produk terlebih dahulu', true); nameInput.focus(); return; }
      if(isNaN(newPrice) || newPrice < 0){ showToast('Harga produk tidak valid', true); priceInput.focus(); return; }
      
      const game = state.catalog.find(g=>g.id===gameId);
      if(!game) return;
      
      const newPid = `prod_${Date.now()}`;
      const newProd = { id: newPid, name: newName, price: newPrice };
      
      if(!game.products) game.products = [];
      game.products.push(newProd);
      
      btn.disabled = true;
      btn.textContent = '⏳';
      
      try {
        const res = await fetch("/api/admin/catalog", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Password": state.adminPass },
          body: JSON.stringify({ catalog: state.catalog })
        });
        const data = await res.json();
        if(data.success){
          showToast(`Produk "${newName}" ditambahkan ke ${game.name} ✓`);
          render();
        } else {
          game.products.pop(); // Revert
          showToast(data.message || 'Gagal menambahkan produk', true);
          btn.disabled = false;
          btn.textContent = '➕ Tambah';
        }
      } catch(e) {
        game.products.pop(); // Revert
        showToast('Gagal menghubungi server', true);
        btn.disabled = false;
        btn.textContent = '➕ Tambah';
      }
    };
  });


  // Reset catalog
  const resetCatalogBtn = document.getElementById('resetCatalogBtn');
  if(resetCatalogBtn) resetCatalogBtn.onclick = async ()=>{
    if(!confirm("Kembalikan katalog ke daftar & harga default? Semua perubahan akan hilang.")) return;
    try {
      const res = await fetch("/api/admin/catalog/reset", { method: "POST", headers: { "X-Admin-Password": state.adminPass } });
      const data = await res.json();
      if(data.success){ state.catalog = data.catalog; showToast('Katalog direset ke default'); render(); }
    } catch(e) { showToast('Gagal menghubungi server', true); }
  };

  // Reset sales
  const resetSalesBtn = document.getElementById('resetSalesBtn');
  if(resetSalesBtn) resetSalesBtn.onclick = async ()=>{
    if(!confirm("Hapus seluruh riwayat transaksi? Data tidak bisa dikembalikan.")) return;
    try {
      const res = await fetch("/api/sales/reset", { method: "POST", headers: { "X-Admin-Password": state.adminPass } });
      const data = await res.json();
      if(data.success){ state.transactions = []; showToast('Riwayat dikosongkan'); render(); }
    } catch(e) { showToast('Gagal menghubungi server', true); }
  };

  // Konfirmasi Lunas manual (admin)
  document.querySelectorAll('[data-confirm-tx]').forEach(btn => {
    btn.onclick = async () => {
      const mRef = btn.dataset.confirmTx;
      if(!confirm('Tandai transaksi ini sebagai LUNAS?')) return;
      btn.textContent = '⏳'; btn.disabled = true;
      try {
        const res = await fetch(`/api/admin/sales/confirm/${mRef}`, {
          method: 'POST',
          headers: { 'X-Admin-Password': state.adminPass }
        });
        const data = await res.json();
        if(data.success){
          showToast('Transaksi ditandai Lunas ✓');
          await loadTransactions(); render();
        } else {
          showToast(data.message || 'Gagal', true);
          btn.textContent = '✅ Lunas'; btn.disabled = false;
        }
      } catch(e) {
        showToast('Gagal menghubungi server', true);
        btn.textContent = '✅ Lunas'; btn.disabled = false;
      }
    };
  });

  // Batalkan transaksi manual (admin)
  document.querySelectorAll('[data-cancel-tx]').forEach(btn => {
    btn.onclick = async () => {
      const mRef = btn.dataset.cancelTx;
      if(!confirm('Batalkan transaksi ini?')) return;
      btn.textContent = '⏳'; btn.disabled = true;
      try {
        const res = await fetch(`/api/admin/sales/cancel/${mRef}`, {
          method: 'POST',
          headers: { 'X-Admin-Password': state.adminPass }
        });
        const data = await res.json();
        if(data.success){
          showToast('Transaksi dibatalkan');
          await loadTransactions(); render();
        } else {
          showToast(data.message || 'Gagal', true);
          btn.textContent = '❌ Batal'; btn.disabled = false;
        }
      } catch(e) {
        showToast('Gagal menghubungi server', true);
        btn.textContent = '❌ Batal'; btn.disabled = false;
      }
    };
  });


  // Save settings
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  if(saveSettingsBtn) saveSettingsBtn.onclick = async ()=>{
    const storeName = document.getElementById('settingStoreName').value.trim();
    const tagline = document.getElementById('settingTagline').value.trim();
    const wa = document.getElementById('settingWa').value.trim();
    const instagram = document.getElementById('settingIg').value.trim();
    try {
      const res = await fetch("/api/admin/config", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Password": state.adminPass },
        body: JSON.stringify({ storeName, tagline, wa, instagram })
      });
      const data = await res.json();
      if(data.success){
        state.config.storeName = storeName || state.config.storeName;
        state.config.tagline = tagline; state.config.wa = wa; state.config.instagram = instagram;
        showToast('Pengaturan toko disimpan ✓'); render();
      } else { showToast(data.message || 'Gagal menyimpan', true); }
    } catch(e) { showToast('Gagal menghubungi server', true); }
  };

  // Save password
  const savePassBtn = document.getElementById('savePassBtn');
  if(savePassBtn) savePassBtn.onclick = async ()=>{
    const np = document.getElementById('newPassInput').value;
    if(np.length < 4){ showToast('Password minimal 4 karakter', true); return; }
    try {
      const res = await fetch("/api/admin/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Password": state.adminPass },
        body: JSON.stringify({ newPassword: np })
      });
      const data = await res.json();
      if(data.success){
        sessionStorage.setItem("syanastore_admin_pw", np); state.adminPass = np;
        showToast('Password admin diubah ✓');
        document.getElementById('newPassInput').value = "";
      } else { showToast(data.message || 'Gagal mengubah password', true); }
    } catch(e) { showToast('Gagal menghubungi server', true); }
  };

  // QRIS File Input & Upload
  const qrisFileInput = document.getElementById('qrisFileInput');
  const uploadQrisBtn = document.getElementById('uploadQrisBtn');
  let selectedQrisBase64 = null;

  if (qrisFileInput) {
    qrisFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      if (file.size > 5 * 1024 * 1024) {
        showToast('Ukuran file maksimal 5MB', true);
        qrisFileInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        selectedQrisBase64 = reader.result;
        
        // Update preview
        const previewImg = document.getElementById('qrisPreviewImg');
        const placeholderText = document.getElementById('qrisPlaceholderText');
        if (previewImg) {
          previewImg.src = selectedQrisBase64;
          previewImg.style.display = 'block';
        }
        if (placeholderText) {
          placeholderText.style.display = 'none';
        }

        if (uploadQrisBtn) {
          uploadQrisBtn.disabled = false;
        }
      };
      reader.readAsDataURL(file);
    };
  }

  if (uploadQrisBtn) {
    uploadQrisBtn.onclick = async () => {
      if (!selectedQrisBase64) return;
      uploadQrisBtn.textContent = '⏳ Mengupload...';
      uploadQrisBtn.disabled = true;

      try {
        const res = await fetch('/api/admin/upload-qris', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Password': state.adminPass
          },
          body: JSON.stringify({ image: selectedQrisBase64 })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Gambar QRIS berhasil diunggah ✓');
          qrisFileInput.value = '';
          selectedQrisBase64 = null;
          uploadQrisBtn.textContent = 'Upload QRIS';
        } else {
          showToast(data.message || 'Gagal mengupload QRIS', true);
          uploadQrisBtn.textContent = 'Upload QRIS';
          uploadQrisBtn.disabled = false;
        }
      } catch (e) {
        showToast('Gagal menghubungi server', true);
        uploadQrisBtn.textContent = 'Upload QRIS';
        uploadQrisBtn.disabled = false;
      }
    };
  }

  // Lacak pesanan handler
  const trackBtn = document.getElementById('trackBtn');
  const trackInput = document.getElementById('trackInput');
  
  const performTrack = async () => {
    if(!trackInput) return;
    const val = trackInput.value.trim();
    if(!val) { showToast('Masukkan nomor WA atau Order ID dulu', true); return; }
    
    state.trackQuery = val;
    state.trackLoading = true;
    render();
    
    try {
      const res = await fetch(`/api/sales/track?q=${encodeURIComponent(val)}`);
      const data = await res.json();
      if(data.success){
        state.trackResults = data.results;
      } else {
        state.trackResults = [];
        showToast(data.message || 'Gagal mencari pesanan', true);
      }
    } catch(e) {
      state.trackResults = [];
      showToast('Gagal menghubungi server', true);
    } finally {
      state.trackLoading = false;
      render();
    }
  };

  if(trackBtn) trackBtn.onclick = performTrack;
  if(trackInput) trackInput.onkeydown = (e) => { if(e.key === 'Enter') performTrack(); };
}

/* ===================== HELPERS ===================== */
function refreshGamesGrid(){
  const container = document.getElementById('gamesGridContainer');
  if(!container) return;
  let list = state.catalog;
  if(state.activeCategory !== 'Semua') list = list.filter(g=>g.category===state.activeCategory);
  if(state.searchQuery) list = list.filter(g=>g.name.toLowerCase().includes(state.searchQuery) || g.publisher.toLowerCase().includes(state.searchQuery));
  if(!list.length){ container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Tidak ditemukan.</div>'; return; }
  container.innerHTML = list.map(g=>`
    <div class="game-card" data-game="${g.id}" role="button" tabindex="0">
      <div class="game-card-img-wrapper"><img class="game-card-img" src="${g.image || '/images/ml.png'}" alt="${g.name}" loading="lazy" /></div>
      <div class="game-card-body"><h4>${g.name}</h4><p>${g.publisher}</p><button class="btn">Lihat Harga →</button></div>
    </div>`).join('');
  container.querySelectorAll('[data-game]').forEach(el=>{
    el.onclick = ()=>{ location.hash = '#/game/'+el.dataset.game; };
  });
}

function startCountdown(expiredUnix){
  clearInterval(qrTimerInterval);
  qrTimerInterval = setInterval(()=>{
    const seconds = Math.max(0, Math.floor(expiredUnix - Date.now()/1000));
    const m = String(Math.floor(seconds/60)).padStart(2,"0");
    const s = String(seconds%60).padStart(2,"0");
    const el = document.getElementById("qrTimerDisplay");
    if(el) el.textContent = `${m}:${s}`;
    if(seconds<=0){
      clearInterval(qrTimerInterval);
      clearInterval(statusPollInterval);
      state.checkoutStep = null; render();
    }
  }, 1000);
}

function startStatusPolling(){
  clearInterval(statusPollInterval);
  statusPollInterval = setInterval(async ()=>{
    try{
      const res = await fetch(`/api/sales/status/${state.checkoutData.merchantRef}`);
      const data = await res.json();
      if(data.success && data.status === "Lunas"){
        clearInterval(statusPollInterval); clearInterval(qrTimerInterval);
        state.checkoutStep = 'success'; render();
        loadRecentSales();
        if(state.isAdmin) loadTransactions();
      }
    }catch(e){}
  }, 4000);
}

/* ===================== INIT ===================== */
loadAll();
